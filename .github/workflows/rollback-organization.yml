# Moves alias live only for erap-get-organization, erap-create-organization, and erap-locations.
name: Rollback organization

on:
  workflow_dispatch:
    inputs:
      erap_get_organization_version:
        description: Published erap-get-organization version to point alias live at
        required: true
        type: string
      erap_create_organization_version:
        description: Published erap-create-organization version to point alias live at
        required: true
        type: string
      erap_locations_version:
        description: Published erap-locations version to point alias live at
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: erap-organization-deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Require the workflow ref to be main
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Reject versions that are not numbers
        env:
          ERAP_GET_ORGANIZATION_VERSION: ${{ inputs.erap_get_organization_version }}
          ERAP_CREATE_ORGANIZATION_VERSION: ${{ inputs.erap_create_organization_version }}
          ERAP_LOCATIONS_VERSION: ${{ inputs.erap_locations_version }}
        run: python -c "import os,re,sys; pat=re.compile(r'^[1-9][0-9]{0,4}$'); keys=('ERAP_GET_ORGANIZATION_VERSION','ERAP_CREATE_ORGANIZATION_VERSION','ERAP_LOCATIONS_VERSION'); sys.exit(0 if all(pat.fullmatch(os.environ[k]) for k in keys) else 1)"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt

      - name: Scan for secrets
        run: python scripts/security_scan.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::481838970142:role/ERAP-GitHub-Production-Organization
          aws-region: eu-north-1
          role-session-name: erap-rollback-organization

      - name: Move organization aliases live to the selected versions
        env:
          ERAP_ENVIRONMENT: production
          AWS_REGION: eu-north-1
          ERAP_GET_ORGANIZATION_VERSION: ${{ inputs.erap_get_organization_version }}
          ERAP_CREATE_ORGANIZATION_VERSION: ${{ inputs.erap_create_organization_version }}
          ERAP_LOCATIONS_VERSION: ${{ inputs.erap_locations_version }}
        run: python scripts/rollback_organization.py

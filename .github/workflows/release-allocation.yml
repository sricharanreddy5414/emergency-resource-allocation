name: Release allocation

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Optional full commit SHA. Leave empty to release the selected ref.
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: erap-allocation-deploy
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
    steps:
      - name: Require the workflow ref to be main
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Reject a commit that is not a full SHA
        if: inputs.commit != ''
        env:
          COMMIT: ${{ inputs.commit }}
        run: python -c "import os,re,sys; sys.exit(0 if re.fullmatch(r'[0-9a-f]{40}', os.environ['COMMIT']) else 1)"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prove the release commit is on main
        id: provenance
        env:
          RELEASE_SHA: ${{ inputs.commit || github.sha }}
        run: |
          sha=$(python scripts/release_provenance.py --sha "$RELEASE_SHA" --main-ref origin/main)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  release:
    needs: prove
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout the proven commit
        run: git checkout "${{ needs.prove.outputs.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Scan for secrets
        run: python scripts/security_scan.py

      - name: Check Lambda packages
        run: python scripts/package_lambdas.py --check

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::481838970142:role/ERAP-GitHub-Production
          aws-region: eu-north-1
          role-session-name: erap-release-allocation

      - name: Publish emergency-resource-allocation and move alias live
        env:
          ERAP_ENVIRONMENT: production
          RELEASE_SHA: ${{ needs.prove.outputs.sha }}
          RELEASE_MAIN_REF: origin/main
        run: python scripts/release_allocation.py

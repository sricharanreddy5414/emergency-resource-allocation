name: Rollback backend

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Lambda version to point alias live at, for example 2
        required: false
        type: string
      commit:
        description: Full 40-character commit SHA to redeploy when a version number is not enough
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: erap-backend-deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Require the workflow ref to be main
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Require a version or a commit
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: python -c "import os,sys; sys.exit(0 if os.environ.get('VERSION') or os.environ.get('COMMIT') else 1)"

      - name: Reject a commit that is not a full SHA
        if: inputs.commit != ''
        env:
          COMMIT: ${{ inputs.commit }}
        run: python -c "import os,re,sys; sys.exit(0 if re.fullmatch(r'[0-9a-f]{40}', os.environ['COMMIT']) else 1)"

      - name: Reject a version that is not a number
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: python -c "import os,re,sys; sys.exit(0 if re.fullmatch(r'[1-9][0-9]{0,4}', os.environ['VERSION']) else 1)"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prove a rollback commit is on main
        if: inputs.version == ''
        env:
          RELEASE_SHA: ${{ inputs.commit }}
        run: python scripts/release_provenance.py --sha "$RELEASE_SHA" --main-ref origin/main

      - name: Checkout the proven commit
        if: inputs.version == ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Scan for secrets
        run: python scripts/security_scan.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::481838970142:role/ERAP-GitHub-Production
          aws-region: eu-north-1
          role-session-name: erap-rollback

      - name: Move alias live to the selected version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/set_live_version.py --version "$VERSION"

      - name: Redeploy the selected commit
        if: inputs.version == ''
        env:
          ERAP_ENVIRONMENT: production
          GITHUB_SHA: ${{ inputs.commit }}
        run: python scripts/deploy_backend.py

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Verify hardening
        run: python scripts/verify_hardening.py

      - name: Write summary
        if: always()
        run: python scripts/render_summary.py >> "$GITHUB_STEP_SUMMARY"

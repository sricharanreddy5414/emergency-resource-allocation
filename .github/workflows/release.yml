name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Optional full commit SHA. Leave empty to release the selected ref.
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: erap-backend-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Require the workflow ref to be main
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Reject a commit that is not a full SHA
        if: inputs.commit != ''
        env:
          COMMIT: ${{ inputs.commit }}
        run: python -c "import os,re,sys; sys.exit(0 if re.fullmatch(r'[0-9a-f]{40}', os.environ['COMMIT']) else 1)"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prove the release commit is on main
        env:
          RELEASE_SHA: ${{ inputs.commit || github.sha }}
        run: python scripts/release_provenance.py --sha "$RELEASE_SHA" --main-ref origin/main

      - name: Checkout the proven commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Scan for secrets
        run: python scripts/security_scan.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::481838970142:role/ERAP-GitHub-Production
          aws-region: eu-north-1
          role-session-name: erap-release

      - name: Deploy the approved commit
        env:
          ERAP_ENVIRONMENT: production
        run: python scripts/deploy_backend.py

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Verify hardening
        run: python scripts/verify_hardening.py

      - name: Write summary
        if: always()
        run: python scripts/render_summary.py >> "$GITHUB_STEP_SUMMARY"

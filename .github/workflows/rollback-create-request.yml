name: Rollback create-request

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published create-request version to point alias live at, for example 78
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: erap-create-request-deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Require the workflow ref to be main
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Reject a version that is not a number
        env:
          VERSION: ${{ inputs.version }}
        run: python -c "import os,re,sys; sys.exit(0 if re.fullmatch(r'[1-9][0-9]{0,4}', os.environ['VERSION']) else 1)"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt

      - name: Scan for secrets
        run: python scripts/security_scan.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::481838970142:role/ERAP-GitHub-Production
          aws-region: eu-north-1
          role-session-name: erap-rollback-create-request

      - name: Move create-request alias live to the selected version
        env:
          ERAP_ENVIRONMENT: production
          CREATE_REQUEST_VERSION: ${{ inputs.version }}
        run: python scripts/rollback_create_request.py
